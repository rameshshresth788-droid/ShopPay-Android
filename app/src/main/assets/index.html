<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10152b"><title>ShopPay Simple Hisaab</title>
<style>
:root{--bg:#0b1020;--panel:#151d34;--text:#f4f6ff;--muted:#9ca9c8;--cash:#ffbd59;--online:#45dfce;--line:#35405d;--purple:#8e80ff;--red:#ff697d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 500px at 50% -20%,#29275a 0%,var(--bg) 70%);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;padding:18px 14px 30px}.app{max-width:720px;margin:auto}.top{text-align:center;margin:4px 0 20px}.top h1{font-size:clamp(24px,6vw,34px);margin:0;letter-spacing:-.7px}.top p{margin:6px 0;color:var(--muted)}.date{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:#ffffff08;border:1px solid var(--line);padding:10px;border-radius:14px;margin-bottom:18px}.date input{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:9px;border-radius:9px;font:inherit}.columns{display:grid;grid-template-columns:1fr 1fr;gap:0;background:#ffffff05;border:1px solid var(--line);border-radius:20px;overflow:hidden}.column{padding:18px 14px;min-width:0}.column+ .column{border-left:2px solid var(--purple)}h2{text-align:center;font-size:clamp(18px,4.8vw,25px);margin:2px 0 18px;letter-spacing:1px}.cash h2{color:var(--cash)}.online h2{color:var(--online)}button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}.add{display:block;width:100%;border-radius:12px;padding:12px 7px;font-weight:750;color:#171322;transition:transform .14s,filter .14s}.add:active{transform:scale(.97);filter:brightness(.9)}.cash .add{background:linear-gradient(135deg,#ffd27e,var(--cash))}.online .add{background:linear-gradient(135deg,#7af3e5,var(--online))}.total{font-size:clamp(19px,5vw,26px);font-weight:800;text-align:center;margin:16px 0 5px;overflow-wrap:anywhere}.cash .total{color:var(--cash)}.online .total{color:var(--online)}.count{text-align:center;font-size:12px;color:var(--muted);margin-bottom:12px}.list{display:flex;flex-direction:column;gap:9px}.entry{background:var(--panel);border:1px solid #ffffff12;border-radius:12px;padding:10px;animation:appear .2s ease}.entrytop{display:flex;justify-content:space-between;gap:5px;align-items:center}.entry strong{overflow-wrap:anywhere}.entry small{display:block;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.del{background:#ff697d20;color:#ff9aa7;border-radius:8px;padding:5px 9px;font-size:13px}.grand{margin-top:16px;background:linear-gradient(135deg,#292553,#191d3a);border:1px solid #8173ff77;border-radius:18px;text-align:center;padding:17px}.grand label{color:#c4bfff;font-weight:650}.grand strong{display:block;font-size:clamp(28px,8vw,38px);margin-top:3px}.hint{text-align:center;color:var(--muted);font-size:12px;margin:13px 0}.empty{text-align:center;color:#8490ad;font-size:13px;padding:12px 2px}.modal{position:fixed;inset:0;z-index:5;background:#000a;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{width:100%;max-width:380px;background:#171f38;border:1px solid #596184;border-radius:20px;padding:20px;box-shadow:0 20px 70px #0008;animation:appear .18s ease}.box h3{margin:0 0 15px;font-size:22px}.box label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}.box input,.box select{width:100%;background:#0c1327;border:1px solid #3b4666;border-radius:10px;padding:12px;color:var(--text);font:inherit;outline:none}.box input:focus,.box select:focus{border-color:var(--purple)}.box select{background:#0c1327;border:1px solid #3b4666;border-radius:10px;padding:12px;color:var(--text);font:inherit;outline:none}.actions{display:flex;gap:9px;margin-top:18px}.actions button{flex:1;padding:12px;border-radius:10px;font-weight:700}.save{background:var(--purple);color:white}.cancel{background:#ffffff12;color:var(--text)}.notes{margin-top:18px;background:#ffffff05;border:1px solid var(--line);border-radius:18px;padding:16px}.notes h2{margin-bottom:5px;color:#c4bfff}.notegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.noteitem{display:grid;grid-template-columns:55px minmax(45px,1fr);gap:8px;align-items:center;background:var(--panel);border:1px solid #ffffff12;border-radius:11px;padding:9px}.notevalue{font-weight:800;color:var(--cash)}.noteitem input{width:100%;min-width:0;background:#0c1327;border:1px solid #3b4666;border-radius:8px;padding:9px;color:var(--text);font:inherit}.noteamount{grid-column:1/-1;text-align:right;color:var(--muted);font-size:13px}.notetotal{margin-top:12px;text-align:center;padding:13px;background:#292553;border-radius:12px;color:#c4bfff}.notetotal strong{display:block;font-size:25px;color:white;margin-top:4px}@media(max-width:340px){.notegrid{grid-template-columns:1fr}}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;background:#e8fff8;color:#082820;padding:10px 16px;border-radius:12px;font-weight:700;transition:.2s;pointer-events:none;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:380px){body{padding:12px 8px}.column{padding:14px 9px}.entry{padding:8px}.del{padding:5px 6px}}
</style></head><body><div class="app"><header class="top"><h1>ShopPay</h1><p>Simple Daily Hisaab</p></header><div class="date"><label for="day">Date:</label><input id="day" type="date" aria-label="Select date"></div><section class="columns"><div class="column cash"><h2>OFFLINE</h2><button type="button" class="add" id="addCash">＋ Add Cash</button><div class="total" id="cashTotal">₹0</div><div class="count" id="cashCount">0 entries</div><div class="list" id="cashList"></div></div><div class="column online"><h2>ONLINE</h2><button type="button" class="add" id="addOnline">＋ Add Online</button><div class="total" id="onlineTotal">₹0</div><div class="count" id="onlineCount">0 entries</div><div class="list" id="onlineList"></div></div></section><section class="grand"><label>GRAND TOTAL</label><strong id="grandTotal">₹0</strong></section>
<section class="notes"><h2>NOTE COUNT</h2><p class="hint">Kitne ka note hai aur kitne notes hain, yahan bharo.</p><div class="notegrid" id="noteGrid"></div><div class="notetotal">Total Physical Cash: <strong id="noteTotal">₹0</strong></div><p class="hint">Ye cash count, Offline/Online payment total se alag rahega.</p></section>
<p class="hint">Records are saved on this device by date.</p></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle"><form class="box" id="paymentForm"><h3 id="formTitle">Add Payment</h3><label for="amount">Amount (₹) *</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="Enter amount" required><label for="gender">Customer</label><select id="gender" required><option value="Male">Male</option><option value="Female">Female</option></select><div class="actions"><button type="button" class="cancel" id="cancel">Cancel</button><button type="submit" class="save" id="savePayment">Save</button></div></form></div><div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const KEY='shoppay_simple_daily_v2', NOTEKEY='shoppay_note_count_v2';
const DENOMS=[500,200,100,50,20,10,5,2,1];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
let selected=today(), paymentType='offline', data={}, notes={};
function readStore(key,fallback){try{const v=JSON.parse(localStorage.getItem(key)||'null');return v&&typeof v==='object'?v:fallback}catch(e){return fallback}}
function saveStore(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(e){alert('Data save nahi ho paya. Browser storage check karein.');return false}}
function entries(){if(!Array.isArray(data[selected]))data[selected]=[];return data[selected]}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function renderNotes(){const dayNotes=notes[selected]||(notes[selected]={});$('noteGrid').innerHTML=DENOMS.map(v=>{const q=Math.max(0,parseInt(dayNotes[v]||0,10)||0);return '<div class="noteitem"><span class="notevalue">₹'+v+'</span><input type="number" min="0" step="1" inputmode="numeric" aria-label="₹'+v+' notes quantity" data-note="'+v+'" value="'+q+'" placeholder="Qty"><span class="noteamount">'+money(v*q)+' total</span></div>'}).join('');$('noteTotal').textContent=money(DENOMS.reduce((sum,v)=>sum+v*(Math.max(0,parseInt(dayNotes[v]||0,10)||0)),0))}
function render(){const all=entries();['offline','online'].forEach(t=>{const list=all.filter(x=>x.type===t);$(t+'Total').textContent=money(list.reduce((sum,x)=>sum+x.amount,0));$(t+'Count').textContent=list.length+' '+(list.length===1?'entry':'entries');const target=$(t==='offline'?'cashList':'onlineList');target.innerHTML=list.length?list.map(x=>'<article class="entry"><div class="entrytop"><strong>'+money(x.amount)+'</strong><button type="button" class="del" data-delete="'+escapeHTML(x.id)+'">Delete</button></div><small>'+escapeHTML(x.gender||'Male')+'</small><small>'+escapeHTML(x.time||'')+'</small></article>').join(''):'<div class="empty">No entries yet</div>'});$('grandTotal').textContent=money(all.reduce((sum,x)=>sum+x.amount,0));renderNotes()}
function openForm(t){paymentType=t;$('formTitle').textContent=t==='offline'?'Add Cash Payment':'Add Online Payment';$('amount').value='';$('gender').value='Male';$('modal').classList.add('show');$('modal').style.display='flex';setTimeout(()=>$('amount').focus(),100)}
function closeForm(){$('modal').classList.remove('show');$('modal').style.display='none'}
$('day').value=selected;
$('day').addEventListener('change',function(){selected=this.value||today();this.value=selected;render()});
$('addCash').addEventListener('click',()=>openForm('offline'));
$('addOnline').addEventListener('click',()=>openForm('online'));
$('cancel').addEventListener('click',closeForm);
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeForm()});
$('paymentForm').addEventListener('submit',function(e){e.preventDefault();e.stopPropagation();try{const amount=Number($('amount').value);if(!Number.isFinite(amount)||amount<=0){alert('Pehle sahi amount bharein.');$('amount').focus();return}const gender=$('gender').value;const now=new Date();const row={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),type:paymentType,amount:Math.round(amount*100)/100,gender:gender,time:now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})};if(!Array.isArray(data[selected]))data[selected]=[];data[selected].push(row);localStorage.setItem(KEY,JSON.stringify(data));render();closeForm();toast('Payment saved successfully');}catch(err){console.error('Save failed:',err);alert('Save nahi hua. Is HTML ko Chrome mein open karke try karein. Agar HopWeb preview hai to browser preview/website mode enable karein.')}});
$('noteGrid').addEventListener('input',e=>{const input=e.target.closest('[data-note]');if(!input)return;const q=Math.max(0,parseInt(input.value||'0',10)||0);(notes[selected]||(notes[selected]={}))[input.dataset.note]=q;saveStore(NOTEKEY,notes);const total=DENOMS.reduce((sum,v)=>sum+v*(Math.max(0,parseInt(notes[selected][v]||0,10)||0)),0);$('noteTotal').textContent=money(total);const item=input.closest('.noteitem');item.querySelector('.noteamount').textContent=money(q*Number(input.dataset.note))+' total'});
document.addEventListener('click',e=>{const b=e.target.closest('[data-delete]');if(!b)return;if(!confirm('Is entry ko delete karna hai?'))return;data[selected]=entries().filter(x=>x.id!==b.dataset.delete);if(saveStore(KEY,data)){render();toast('Entry deleted')}});
data=readStore(KEY,{});notes=readStore(NOTEKEY,{});render();
})();
</script></body></html>
